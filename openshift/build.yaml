apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jenkins-cicd-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jenkins-cicd-app
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: jenkins-cicd-app:latest
