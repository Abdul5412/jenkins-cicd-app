apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-cicd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-cicd-app
  template:
    metadata:
      labels:
        app: jenkins-cicd-app
    spec:
      containers:
      - name: jenkins-cicd-app
        image: image-registry.openshift-image-registry.svc:5000/jenkins-cicd-app/jenkins-cicd-app:latest
        ports:
        - containerPort: 80
